name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    name: Analyze, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The web build is the fastest end-to-end proof that the widget tree
      # compiles on a target that does not need a signing key or an emulator.
      - name: Build web
        run: flutter build web --release

  build-android:
    name: Build Android bundle
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Unsigned on purpose: this only checks that the release build compiles
      # and that the Gradle config is sound. Signing happens locally, where the
      # keystore and its passwords live.
      #
      # No `--no-shrink` here, unlike the earlier workflow: that flag exists to
      # skip R8 on a build Play would reject anyway, and running the real release
      # pipeline is what catches a missing keep-rule before upload. If R8 ever
      # strips something Firebase needs, the failure should surface here rather
      # than in the Play Console.
      - name: Build app bundle
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
